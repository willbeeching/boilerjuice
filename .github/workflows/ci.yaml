name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

# Nothing here writes to the repository.
permissions:
  contents: read

env:
  # Linting and typing run on the same interpreter as the current test lane,
  # because mypy has to parse the Home Assistant annotations that lane
  # installs. The minimum lane pins its own interpreter in the matrix.
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-test.txt

      - name: Check formatting
        run: ruff format --check custom_components tests scripts

      - name: Lint
        run: ruff check custom_components tests scripts

      - name: Type check
        run: mypy

      - name: Lint the workflows
        # Downloaded by pinned version and verified by digest, rather than
        # trusting another action to lint the actions.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" actionlint
          ./actionlint

  test:
    name: Tests (Home Assistant ${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor declared in hacs.json, and the current release. A
          # minimum nobody tests is a minimum nobody supports.
          #
          # Each lane names its own interpreter: Home Assistant raises its
          # Python floor regularly, so the two lanes do not share one.
          # scripts/check_versions.py checks these against the annotations in
          # the requirements files.
          - lane: minimum
            requirements: requirements-test-min.txt
            python: "3.13"
          - lane: current
            requirements: requirements-test.txt
            python: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Report the Home Assistant version under test
        run: python -c "from homeassistant.const import __version__; print(__version__)"

      - name: Run tests
        # The suite is entirely offline: pytest-homeassistant-custom-component
        # blocks sockets and every BoilerJuice response comes from a fixture.
        # No BoilerJuice credentials exist in CI and none are needed.
        run: pytest --cov=custom_components.boilerjuice --cov-report=term-missing --cov-report=json

      - name: Enforce per-module coverage
        run: python scripts/check_module_coverage.py coverage.json 95

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit the integration's own dependencies
        run: |
          python - <<'PY' > manifest-requirements.txt
          import json, pathlib
          manifest = json.loads(
              pathlib.Path("custom_components/boilerjuice/manifest.json").read_text()
          )
          print("\n".join(manifest["requirements"]))
          PY
          pip-audit --requirement manifest-requirements.txt --strict

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the manifest, hacs.json and the quality scale agree
        run: python scripts/check_versions.py

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
