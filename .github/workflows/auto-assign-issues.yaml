name: Auto-assign Issues

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign Issue
        uses: pozil/auto-assign-issue@d6e511896e5f1d2408e74db74416647d8ff80c8c # v4.1.0
        with:
          assignees: willbeeching
          numOfAssignee: 1
