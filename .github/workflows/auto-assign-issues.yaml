name: Auto-assign Issues

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-assign Issue
        uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
        with:
          assignees: willbeeching
          numOfAssignee: 1
