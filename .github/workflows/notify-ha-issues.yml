name: Notify HA issues

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# Outbound webhook only. Secrets GROK_WEBHOOK_URL and GROK_WEBHOOK_KEY
# are repository secrets; this file does not define their values.
permissions: {}

jobs:
  notify:
    name: Forward to HA watcher
    if: ${{ github.event.issue.pull_request == null }}
    runs-on: ubuntu-latest
    steps:
      - name: POST event to webhook
        env:
          WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_WEBHOOK_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ -z "$WEBHOOK_URL" || -z "$WEBHOOK_KEY" ]]; then
            echo "GROK_WEBHOOK_URL or GROK_WEBHOOK_KEY is unset."
            exit 1
          fi

          # GITHUB_EVENT_PATH is the webhook payload already on the runner.
          payload="$(jq -c \
            --arg github_event "$EVENT_NAME" \
            --arg actor "$ACTOR" \
            '{
              github_event: $github_event,
              action: .action,
              repository: {full_name: .repository.full_name},
              issue: {
                number: .issue.number,
                title: .issue.title,
                html_url: .issue.html_url,
                state: .issue.state
              },
              actor: {login: $actor}
            } + (
              if $github_event == "issue_comment" then
                {
                  comment: {
                    body: (.comment.body // "" | .[0:2000]),
                    html_url: .comment.html_url
                  }
                }
              else
                {}
              end
            )' "$GITHUB_EVENT_PATH")"

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          # --silent keeps curl from printing the URL or the bearer token.
          if ! status="$(
            curl --silent --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${WEBHOOK_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary "$payload" \
              --url "$WEBHOOK_URL"
          )"; then
            echo "Webhook request failed before an HTTP response."
            exit 1
          fi

          if [[ "$status" != "200" ]]; then
            echo "Webhook returned HTTP ${status}."
            exit 1
          fi
