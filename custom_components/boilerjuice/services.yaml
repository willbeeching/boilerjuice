reset_consumption:
  name: Reset Consumption
  description: >-
    Reset the consumption counters, history and references to zero, and clear
    any manual daily consumption override. With more than one BoilerJuice
    account configured, a target is required.
  fields:
    device_id:
      name: Device
      description: Optional BoilerJuice tank device to target.
      required: false
      selector:
        device:
          integration: boilerjuice
    entry_id:
      name: Config entry ID
      description: Optional config entry ID to target a specific account.
      required: false
      example: 01HZ...abcd
      selector:
        text:

set_consumption:
  name: Set Consumption
  description: >-
    Manually set the consumption values for the oil tank. With more than one
    BoilerJuice account configured, a target is required.
  fields:
    liters:
      name: Total Consumption
      description: The total consumption in liters.
      required: true
      example: 100.5
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L"
          mode: box
    daily:
      name: Daily Consumption
      description: >-
        Optional daily consumption override in litres per day. It replaces the
        measured rate and persists across updates and restarts until you run
        "Reset consumption".
      required: false
      example: 5.2
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L/day"
          mode: box
    device_id:
      name: Device
      description: Optional BoilerJuice tank device to target.
      required: false
      selector:
        device:
          integration: boilerjuice
    entry_id:
      name: Config entry ID
      description: Optional config entry ID to target a specific account.
      required: false
      example: 01HZ...abcd
      selector:
        text:
