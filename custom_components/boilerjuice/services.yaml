reset_consumption:
  name: Reset Consumption
  description: >-
    Reset the consumption counters to zero. If no target is provided the
    service is applied to every configured BoilerJuice account.
  target:
    device:
      integration: boilerjuice
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID to target a specific account.
      required: false
      example: 01HZ...abcd
      selector:
        text:

set_consumption:
  name: Set Consumption
  description: >-
    Manually set the consumption values for the oil tank. If no target is
    provided the service is applied to every configured BoilerJuice account.
  target:
    device:
      integration: boilerjuice
  fields:
    liters:
      name: Total Consumption
      description: The total consumption in liters.
      required: true
      example: 100.5
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L"
          mode: box
    daily:
      name: Daily Consumption
      description: The daily consumption in liters.
      required: false
      example: 5.2
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L/day"
          mode: box
    entry_id:
      name: Config entry ID
      description: Optional config entry ID to target a specific account.
      required: false
      example: 01HZ...abcd
      selector:
        text:
