# Entity filter only on every target. A service target does not take a device
# filter - hassfest rejects one - and it does not need to: the picker offers
# the devices and areas holding these entities, and Home Assistant still
# passes device_id, area_id, floor_id and label_id through in the call.

reset_consumption:
  name: Reset consumption
  description: >-
    Reset the consumption counters and references to zero, and clear any
    manual daily consumption override. The dated history behind the seasonal
    averages is kept unless you ask for it to go. Targeting a tank resets
    that tank; targeting the account resets every tank on it. With more than
    one BoilerJuice account configured, a target is required, and it must name
    one account: a target reaching two is refused rather than half-applied.
  target:
    entity:
      integration: boilerjuice
  fields:
    clear_history:
      name: Also clear the consumption history
      description: >-
        Deletes the per-day consumption history as well as the counters. The
        seasonal and monthly averages are built from it and take a year to
        rebuild, so leave this off unless the history itself is wrong.
      required: false
      default: false
      selector:
        boolean:
    entry_id:
      name: Config entry ID
      description: >-
        Optional. Targets a whole BoilerJuice account rather than one tank.
      required: false
      example: 01HZ...abcd
      selector:
        text:

set_consumption:
  name: Set consumption
  description: >-
    Manually set the consumption values for a tank. With more than one
    BoilerJuice account configured, a target is required, and it must name
    one account: a target reaching two is refused rather than half-applied.
  target:
    entity:
      integration: boilerjuice
  fields:
    liters:
      name: Total consumption
      description: The total consumption in litres.
      required: true
      example: 100.5
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L"
          mode: box
    daily:
      name: Daily consumption
      description: >-
        Optional daily consumption override in litres per day. It replaces the
        measured rate and persists across updates and restarts until you run
        "Reset consumption".
      required: false
      example: 5.2
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "L/day"
          mode: box
    entry_id:
      name: Config entry ID
      description: >-
        Optional. Targets a whole BoilerJuice account rather than one tank.
      required: false
      example: 01HZ...abcd
      selector:
        text:
